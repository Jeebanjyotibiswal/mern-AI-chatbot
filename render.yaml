services:
  # AI Service (FastAPI)
  - type: web
    name: ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set in Render dashboard

  # Backend (Node.js)
  - type: web
    name: mern-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # Set in Render dashboard
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ai-service
          property: host

  # Frontend (Static Site)
  - type: static
    name: mern-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mern-backend
          property: host
        suffix: /api
